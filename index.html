<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/api/apps/manifests/68e28688c6f4ec5cd17e317d/manifest.json" />
    <title>PlayECG</title>
    <script src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"></script>

    <!-- PWA: tema e cor de fundo -->
    <meta name="theme-color" content="#0D1E30" />
    <!-- O app tem design apenas claro. Declarar isso impede que o WebView/Chrome
         aplique o escurecimento automatico dele quando o sistema esta no modo noturno,
         que inverte os fundos mas mantem o texto escuro (texto escuro sobre fundo escuro). -->
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- PWA: suporte iOS (Safari) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PlayECG" />
    <link rel="apple-touch-icon" href="https://media.base44.com/images/public/68e28688c6f4ec5cd17e317d/6e285e521_903B5817-5009-4B34-8478-509B00A9C6B82.png" />

    <!-- SEO / Open Graph -->
    <meta name="description" content="Casos reais de eletrocardiograma em desafios curtos e módulos que você desbloqueia jogando. Para médicos e estudantes." />
    <meta property="og:title" content="PlayECG — aprenda ECG jogando" />
    <meta property="og:description" content="Casos reais de eletrocardiograma em desafios curtos e módulos que você desbloqueia jogando. Para médicos e estudantes." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PlayECG" />
    <meta property="og:image" content="https://media.base44.com/images/public/68e28688c6f4ec5cd17e317d/73e4543f6_playecg-og-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PlayECG — aprenda ECG jogando" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PlayECG — aprenda ECG jogando" />
    <meta name="twitter:description" content="Casos reais de eletrocardiograma em desafios curtos e módulos que você desbloqueia jogando. Para médicos e estudantes." />

    <!-- Nunito (títulos + UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
